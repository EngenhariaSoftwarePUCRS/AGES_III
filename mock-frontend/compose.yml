services:
  dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: npm run dev

  prod:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    env_file:
      - .env